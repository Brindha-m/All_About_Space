<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#fffefb"/>
  <text x="50" y="70" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="34" font-weight="700" fill="#1f2937">More telescopes add more clues</text>
  <rect x="50" y="82" width="420" height="8" rx="4" fill="#77c943"/>

  <!-- Timeline -->
  <line x1="100" y1="300" x2="1100" y2="300" stroke="#1f2937" stroke-width="4"/>

  <!-- Past -->
  <circle cx="220" cy="300" r="12" fill="#3d65d8"/>
  <rect x="120" y="130" width="200" height="130" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/>
  <path d="M170 220 L210 175 H230 L220 230 Z" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/>
  <line x1="185" y1="230" x2="230" y2="230" stroke="#1f2937" stroke-width="3"/>
  <text x="220" y="350" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="18" font-weight="700" fill="#1f2937">earlier images</text>
  <text x="220" y="400" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="16" fill="#4b5563">baseline</text>

  <!-- Now -->
  <circle cx="600" cy="300" r="14" fill="#f0a020"/>
  <rect x="480" y="130" width="240" height="130" rx="12" fill="#fef9c3" stroke="#1f2937" stroke-width="3"/>
  <rect x="520" y="160" width="90" height="30" rx="6" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/>
  <rect x="610" y="168" width="30" height="16" fill="#93c5fd" stroke="#1f2937" stroke-width="2"/>
  <path d="M520 220 C555 220 570 215 590 185 C605 160 620 160 640 185 C660 215 675 220 700 220" fill="none" stroke="#3d65d8" stroke-width="3"/>
  <text x="600" y="350" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="18" font-weight="700" fill="#1f2937">Roman event</text>
  <text x="600" y="400" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="16" fill="#4b5563">discovery</text>

  <!-- Future -->
  <circle cx="980" cy="300" r="12" fill="#77c943"/>
  <rect x="860" y="130" width="240" height="130" rx="12" fill="#d1fae5" stroke="#1f2937" stroke-width="3"/>
  <circle cx="930" cy="185" r="14" fill="#1f2937"/>
  <circle cx="1020" cy="185" r="12" fill="#fde68a" stroke="#1f2937" stroke-width="2"/>
  <line x1="948" y1="185" x2="1004" y2="185" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="975" y="230" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="14" fill="#4b5563">lens · source apart</text>
  <text x="980" y="350" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="18" font-weight="700" fill="#1f2937">later images</text>
  <text x="980" y="400" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="16" fill="#4b5563">mass &amp; distance</text>

  <text x="600" y="520" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="24" fill="#1f2937">Longer timelines help measure motion, distance, and mass.</text>
  <text x="600" y="580" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20" fill="#4b5563">Years later, lens and source can separate enough to be seen apart.</text>
</svg>
