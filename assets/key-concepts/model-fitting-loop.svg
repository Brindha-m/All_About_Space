<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#fffefb"/>
  <text x="50" y="70" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="34" font-weight="700" fill="#1f2937">Fitting means improving a guess</text>
  <rect x="50" y="82" width="420" height="8" rx="4" fill="#77c943"/>

  <!-- 1 -->
  <rect x="40" y="140" width="220" height="180" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
  <text x="150" y="185" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20" font-weight="700" fill="#1f2937">t₀ , u₀ , tᴇ</text>
  <circle cx="100" cy="250" r="12" fill="#fde68a" stroke="#1f2937" stroke-width="2"/>
  <circle cx="150" cy="250" r="16" fill="#1f2937"/>
  <circle cx="200" cy="250" r="10" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/>
  <text x="150" y="360" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20" font-weight="700" fill="#1f2937">1. choose</text>

  <path d="M270 230h40" stroke="#1f2937" stroke-width="3"/><path d="M295 218l15 12-15 12" fill="none" stroke="#1f2937" stroke-width="3"/>

  <!-- 2 -->
  <rect x="320" y="140" width="220" height="180" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
  <line x1="345" y1="280" x2="515" y2="280" stroke="#d1d5db" stroke-width="2"/>
  <path d="M355 270 C390 270 405 265 425 220 C440 185 455 185 470 220 C490 265 505 270 515 270" fill="none" stroke="#3d65d8" stroke-width="4"/>
  <text x="430" y="360" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20" font-weight="700" fill="#1f2937">2. predict</text>

  <path d="M550 230h40" stroke="#1f2937" stroke-width="3"/><path d="M575 218l15 12-15 12" fill="none" stroke="#1f2937" stroke-width="3"/>

  <!-- 3 -->
  <rect x="600" y="140" width="220" height="180" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
  <line x1="625" y1="280" x2="795" y2="280" stroke="#d1d5db" stroke-width="2"/>
  <path d="M635 270 C670 270 685 265 705 220 C720 185 735 185 750 220 C770 265 785 270 795 270" fill="none" stroke="#3d65d8" stroke-width="3"/>
  <circle cx="650" cy="265" r="5" fill="#f0a020"/><circle cx="700" cy="220" r="5" fill="#f0a020"/>
  <circle cx="750" cy="225" r="5" fill="#f0a020"/><circle cx="780" cy="265" r="5" fill="#f0a020"/>
  <text x="710" y="360" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20" font-weight="700" fill="#1f2937">3. compare</text>

  <path d="M830 230h40" stroke="#1f2937" stroke-width="3"/><path d="M855 218l15 12-15 12" fill="none" stroke="#1f2937" stroke-width="3"/>

  <!-- 4 -->
  <rect x="880" y="140" width="250" height="180" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
  <text x="1005" y="230" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="32" font-weight="700" fill="#1f2937">χ²</text>
  <text x="1005" y="270" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="18" fill="#4b5563">or likelihood</text>
  <text x="1005" y="360" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20" font-weight="700" fill="#1f2937">4. score</text>

  <!-- Loop -->
  <path d="M1005 340 C1005 430 850 470 600 470 C350 470 150 430 150 360" fill="none" stroke="#f0a020" stroke-width="4"/>
  <path d="M140 375l10-20 18 10" fill="none" stroke="#f0a020" stroke-width="4"/>
  <text x="600" y="510" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20" fill="#b45309">repeat until the model matches the data</text>

  <text x="600" y="580" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="22" fill="#1f2937">Try many starting points so a good solution is not missed.</text>
  <text x="600" y="630" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="18" fill="#4b5563">MCMC and nested sampling differ mainly in how the next guess is chosen.</text>
</svg>
