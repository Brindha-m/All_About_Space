<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#fffefb"/>
  <text x="50" y="70" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="32" font-weight="700" fill="#1f2937">Roman watches the same stars again and again</text>
  <rect x="50" y="82" width="520" height="8" rx="4" fill="#77c943"/>

  <!-- Telescope -->
  <g>
    <rect x="70" y="200" width="160" height="70" rx="10" fill="#dbeafe" stroke="#1f2937" stroke-width="4"/>
    <rect x="230" y="215" width="50" height="40" rx="4" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/>
    <circle cx="290" cy="235" r="10" fill="#1f2937"/>
    <rect x="95" y="155" width="110" height="40" rx="4" fill="#93c5fd" stroke="#1f2937" stroke-width="3"/>
    <line x1="95" y1="175" x2="205" y2="175" stroke="#1f2937" stroke-width="2"/>
    <line x1="150" y1="155" x2="150" y2="195" stroke="#1f2937" stroke-width="2"/>
  </g>
  <text x="155" y="320" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20" font-weight="700" fill="#1f2937">Roman telescope</text>
  <line x1="300" y1="235" x2="390" y2="235" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Star field -->
  <rect x="400" y="140" width="260" height="200" rx="12" fill="#0f172a" stroke="#1f2937" stroke-width="4"/>
  <g fill="#fde68a">
    <circle cx="440" cy="175" r="3"/><circle cx="480" cy="200" r="2"/><circle cx="520" cy="160" r="4"/>
    <circle cx="560" cy="210" r="2"/><circle cx="600" cy="180" r="3"/><circle cx="630" cy="230" r="2"/>
    <circle cx="450" cy="250" r="2"/><circle cx="500" cy="280" r="3"/><circle cx="550" cy="260" r="2"/>
    <circle cx="590" cy="300" r="4"/><circle cx="630" cy="270" r="2"/><circle cx="470" cy="300" r="2"/>
  </g>
  <circle cx="545" cy="230" r="7" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  <text x="530" y="380" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20" font-weight="700" fill="#1f2937">crowded bulge field</text>

  <!-- Microlensing curve -->
  <rect x="720" y="130" width="420" height="140" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>
  <text x="740" y="158" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20" font-weight="700" fill="#1d4ed8">microlensing → brighter</text>
  <line x1="760" y1="230" x2="1100" y2="230" stroke="#d1d5db" stroke-width="2"/>
  <path d="M780 225 C820 225 845 220 870 175 C890 140 910 140 930 175 C955 220 980 225 1020 225 L1080 225"
        fill="none" stroke="#3d65d8" stroke-width="5" stroke-linecap="round"/>

  <!-- Transit curve -->
  <rect x="720" y="300" width="420" height="140" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>
  <text x="740" y="328" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20" font-weight="700" fill="#b45309">transit → dimmer</text>
  <line x1="760" y1="360" x2="1100" y2="360" stroke="#d1d5db" stroke-width="2"/>
  <path d="M780 355 H850 C870 355 875 410 900 410 H980 C1005 410 1010 355 1030 355 H1080"
        fill="none" stroke="#f0a020" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="600" y="520" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="28" font-weight="700" fill="#1f2937">One survey — two ways to find planets</text>
  <text x="600" y="575" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="22" fill="#4b5563">Repeated imaging turns a camera into a time-domain survey.</text>
</svg>
