<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#fffefb"/>
  <text x="50" y="70" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="32" font-weight="700" fill="#1f2937">Found planets are only part of the story</text>
  <rect x="50" y="82" width="500" height="8" rx="4" fill="#77c943"/>

  <!-- Found -->
  <rect x="40" y="130" width="300" height="250" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
  <g fill="#60a5fa" stroke="#1f2937" stroke-width="2">
    <circle cx="100" cy="190" r="14"/><circle cx="160" cy="180" r="12"/>
    <circle cx="220" cy="210" r="16"/><circle cx="130" cy="250" r="11"/>
    <circle cx="200" cy="270" r="13"/>
  </g>
  <g fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4">
    <circle cx="270" cy="190" r="12"/><circle cx="90" cy="310" r="12"/>
    <circle cx="170" cy="320" r="12"/><circle cx="250" cy="300" r="12"/>
    <circle cx="280" cy="250" r="12"/>
  </g>
  <text x="190" y="430" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="18" font-weight="700" fill="#1f2937">planets we found</text>
  <text x="190" y="455" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="15" fill="#6b7280">dashed = missed</text>

  <path d="M350 255h60" stroke="#1f2937" stroke-width="3"/><path d="M390 243l20 12-20 12" fill="none" stroke="#1f2937" stroke-width="3"/>

  <!-- Correction -->
  <rect x="420" y="130" width="280" height="250" rx="14" fill="#fef9c3" stroke="#1f2937" stroke-width="3"/>
  <path d="M480 170h160l-35 90H515z" fill="#fde68a" stroke="#1f2937" stroke-width="3"/>
  <path d="M515 260h110l-30 80H545z" fill="#fbbf24" stroke="#1f2937" stroke-width="3"/>
  <text x="560" y="230" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="700" fill="#1f2937">÷ efficiency</text>
  <text x="560" y="430" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="18" font-weight="700" fill="#1f2937">correct for completeness</text>

  <path d="M710 255h60" stroke="#1f2937" stroke-width="3"/><path d="M750 243l20 12-20 12" fill="none" stroke="#1f2937" stroke-width="3"/>

  <!-- True population -->
  <rect x="780" y="130" width="360" height="250" rx="14" fill="#d1fae5" stroke="#1f2937" stroke-width="3"/>
  <g fill="#34d399" stroke="#1f2937" stroke-width="2">
    <circle cx="840" cy="185" r="11"/><circle cx="890" cy="170" r="13"/><circle cx="940" cy="195" r="10"/>
    <circle cx="990" cy="180" r="12"/><circle cx="1040" cy="200" r="11"/>
    <circle cx="830" cy="245" r="10"/><circle cx="880" cy="260" r="13"/><circle cx="930" cy="240" r="11"/>
    <circle cx="980" cy="265" r="12"/><circle cx="1030" cy="250" r="10"/>
    <circle cx="860" cy="315" r="11"/><circle cx="920" cy="325" r="13"/><circle cx="980" cy="310" r="10"/>
    <circle cx="1040" cy="330" r="11"/>
  </g>
  <path d="M1080 165l18 18 35-40" fill="none" stroke="#047857" stroke-width="5" stroke-linecap="round"/>
  <text x="960" y="430" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="18" font-weight="700" fill="#1f2937">true planet population</text>

  <text x="600" y="540" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="24" fill="#1f2937">Hard-to-find planets need a bigger correction.</text>
  <text x="600" y="600" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20" fill="#4b5563">Occurrence rates = detections ÷ what could have been found.</text>
</svg>
