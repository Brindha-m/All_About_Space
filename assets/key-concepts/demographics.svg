    <circle cx="235" cy="265" r="20"/><circle cx="295" cy="215" r="20"/>
    <circle cx="165" cy="315" r="20"/><circle cx="285" cy="335" r="20"/>
    <path d="M355 270h130M458 248l28 22-28 22"/>
