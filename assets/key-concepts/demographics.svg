  <g fill="#292727" font-family="'Segoe Print','Comic Sans MS',cursive">
    <text x="55" y="86" font-size="44" font-weight="700">Found planets are only part of the story</text>
    <text x="55" y="470" font-size="35" font-weight="700">planets we found</text>
    <text x="470" y="385" font-size="32" text-anchor="middle">correct for planets</text>
    <text x="470" y="425" font-size="32" text-anchor="middle">we probably missed</text>
    <text x="840" y="470" font-size="31" font-weight="700">true planet population</text>
    <text x="155" y="535" font-size="31">Hard-to-find planets need a bigger correction.</text>
    <text x="275" y="585" font-size="31">That correction is called completeness.</text>
  </g>
