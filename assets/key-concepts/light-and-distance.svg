<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#fffefb"/>
  <!-- Title -->
  <text x="50" y="70" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="36" font-weight="700" fill="#1f2937">Light spreads out as it travels</text>
  <rect x="50" y="82" width="420" height="8" rx="4" fill="#77c943"/>

  <!-- Star -->
  <circle cx="160" cy="280" r="42" fill="#fde68a" stroke="#1f2937" stroke-width="4"/>
  <g stroke="#1f2937" stroke-width="4" stroke-linecap="round">
    <line x1="160" y1="220" x2="160" y2="200"/>
    <line x1="160" y1="360" x2="160" y2="340"/>
    <line x1="100" y1="280" x2="80" y2="280"/>
    <line x1="220" y1="280" x2="240" y2="280"/>
    <line x1="118" y1="238" x2="104" y2="224"/>
    <line x1="202" y1="322" x2="216" y2="336"/>
    <line x1="118" y1="322" x2="104" y2="336"/>
    <line x1="202" y1="238" x2="216" y2="224"/>
  </g>
  <text x="160" y="400" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="24" font-weight="700" fill="#1f2937">star</text>

  <!-- Expanding light cone / spherical shells (arcs) -->
  <path d="M230 200 A 140 140 0 0 1 230 360" fill="none" stroke="#9ca3af" stroke-width="3"/>
  <path d="M280 150 A 240 240 0 0 1 280 410" fill="none" stroke="#9ca3af" stroke-width="3"/>

  <!-- Rays through both patches -->
  <g stroke="#3d65d8" stroke-width="3" stroke-linecap="round">
    <line x1="200" y1="255" x2="980" y2="175"/>
    <line x1="200" y1="270" x2="980" y2="230"/>
    <line x1="200" y1="290" x2="980" y2="330"/>
    <line x1="200" y1="305" x2="980" y2="385"/>
  </g>

  <!-- Near patch at d: same size square, dense rays -->
  <rect x="430" y="230" width="90" height="90" fill="#fef3c7" stroke="#f0a020" stroke-width="4"/>
  <g stroke="#3d65d8" stroke-width="3">
    <line x1="445" y1="245" x2="505" y2="245"/>
    <line x1="445" y1="265" x2="505" y2="265"/>
    <line x1="445" y1="285" x2="505" y2="285"/>
    <line x1="445" y1="305" x2="505" y2="305"/>
  </g>
  <text x="475" y="360" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#b45309">near = bright</text>
  <text x="475" y="388" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="18" fill="#6b7280">4 rays in patch</text>

  <!-- Far patch at 2d: same size square, 1 ray -->
  <rect x="850" y="230" width="90" height="90" fill="#e5e7eb" stroke="#3d65d8" stroke-width="4"/>
  <line x1="865" y1="275" x2="925" y2="275" stroke="#3d65d8" stroke-width="3"/>
  <text x="895" y="360" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#1d4ed8">far = faint</text>
  <text x="895" y="388" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="18" fill="#6b7280">1 ray in same patch</text>

  <!-- Distance bars -->
  <g stroke="#1f2937" stroke-width="3" stroke-linecap="round">
    <line x1="160" y1="440" x2="475" y2="440"/>
    <line x1="160" y1="430" x2="160" y2="450"/>
    <line x1="475" y1="430" x2="475" y2="450"/>
    <line x1="160" y1="490" x2="895" y2="490"/>
    <line x1="160" y1="480" x2="160" y2="500"/>
    <line x1="895" y1="480" x2="895" y2="500"/>
  </g>
  <text x="318" y="465" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20" fill="#1f2937">distance d</text>
  <text x="528" y="515" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20" fill="#1f2937">distance 2d</text>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="28" font-weight="700" fill="#1f2937">Twice as far → area ×4 → brightness ÷4   (1/d²)</text>
  <text x="600" y="640" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="22" fill="#4b5563">That is why magnitudes, distance, and extinction are linked.</text>
</svg>
