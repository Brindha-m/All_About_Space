<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#fffefb"/>
  <text x="50" y="70" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="34" font-weight="700" fill="#1f2937">Microlensing = gravity bends light</text>
  <rect x="50" y="82" width="480" height="8" rx="4" fill="#77c943"/>

  <!-- Source -->
  <circle cx="140" cy="230" r="30" fill="#fde68a" stroke="#1f2937" stroke-width="4"/>
  <g stroke="#1f2937" stroke-width="3" stroke-linecap="round">
    <line x1="140" y1="185" x2="140" y2="170"/><line x1="140" y1="275" x2="140" y2="290"/>
    <line x1="95" y1="230" x2="80" y2="230"/><line x1="185" y1="230" x2="200" y2="230"/>
  </g>
  <text x="140" y="340" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#1f2937">source</text>
  <text x="140" y="365" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="16" fill="#6b7280">far-away star</text>

  <!-- Bent rays -->
  <path d="M170 215 C300 120 420 120 500 200" fill="none" stroke="#3d65d8" stroke-width="4"/>
  <path d="M170 245 C300 340 420 340 500 260" fill="none" stroke="#3d65d8" stroke-width="4"/>
  <path d="M540 205 C680 130 820 150 920 215" fill="none" stroke="#3d65d8" stroke-width="4"/>
  <path d="M540 255 C680 330 820 310 920 245" fill="none" stroke="#3d65d8" stroke-width="4"/>

  <!-- Lens + Einstein ring -->
  <circle cx="520" cy="230" r="52" fill="none" stroke="#f0a020" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="520" cy="230" r="20" fill="#1f2937"/>
  <text x="520" y="160" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="16" fill="#b45309">Einstein ring</text>
  <text x="520" y="340" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#1f2937">lens</text>
  <text x="520" y="365" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="16" fill="#6b7280">foreground mass</text>

  <!-- Telescope -->
  <circle cx="980" cy="230" r="28" fill="#bfdbfe" stroke="#1f2937" stroke-width="3"/>
  <line x1="962" y1="230" x2="998" y2="230" stroke="#1f2937" stroke-width="3"/>
  <line x1="980" y1="212" x2="980" y2="248" stroke="#1f2937" stroke-width="3"/>
  <rect x="1020" y="215" width="55" height="30" rx="4" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/>
  <circle cx="1085" cy="230" r="7" fill="#1f2937"/>
  <text x="1020" y="340" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#1f2937">telescope</text>
  <text x="1020" y="365" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="16" fill="#6b7280">observer</text>

  <!-- Light curve -->
  <rect x="280" y="420" width="640" height="140" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>
  <line x1="310" y1="520" x2="890" y2="520" stroke="#d1d5db" stroke-width="2"/>
  <path d="M330 510 C420 510 470 500 520 450 C555 415 575 415 610 450 C660 500 710 510 800 510 L870 510"
        fill="none" stroke="#3d65d8" stroke-width="5" stroke-linecap="round"/>
  <text x="600" y="590" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20" font-weight="700" fill="#1f2937">brightness over time</text>

  <text x="600" y="660" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="22" fill="#4b5563">No light from the lens is required — dark objects can still be weighed.</text>
</svg>
