  <g fill="#292727" font-family="'Segoe Print','Comic Sans MS',cursive" text-anchor="middle">
    <text x="55" y="84" font-size="44" font-weight="700" text-anchor="start">Start simple, then add complexity</text>
    <text x="207" y="375" font-size="31" font-weight="700">one lens</text>
    <text x="207" y="415" font-size="28">basic event</text>
    <text x="597" y="375" font-size="31" font-weight="700">two lenses</text>
    <text x="597" y="415" font-size="28">planet or binary</text>
    <text x="987" y="375" font-size="31" font-weight="700">extra effects</text>
    <text x="987" y="415" font-size="28">parallax or motion</text>
    <text x="600" y="525" font-size="33">Add a harder model only when the data require it.</text>
    <text x="600" y="580" font-size="28">This reduces overfitting and false discoveries.</text>
  </g>
