  <g fill="none" stroke="#292727" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="70" y="175" width="275" height="100" rx="18"/>
    <rect x="460" y="175" width="275" height="100" rx="18"/>
    <rect x="850" y="175" width="275" height="100" rx="18"/>
    <path d="M345 225h115M432 203l28 22-28 22M735 225h115M822 203l28 22-28 22"/>
    <circle cx="150" cy="225" r="18" fill="#292727"/>
    <circle cx="520" cy="225" r="18" fill="#292727"/><circle cx="570" cy="225" r="10"/>
    <circle cx="915" cy="225" r="18" fill="#292727"/><circle cx="965" cy="225" r="10"/><path d="M1015 195c35 25 35 55 0 80"/>
  </g>
  <g fill="none" stroke-width="10" stroke-linecap="round">
    <path d="M55 102h495" stroke="#77c943"/>
    <path d="M90 335h230" stroke="#3d65d8"/>
    <path d="M480 335h230" stroke="#f0a020"/>
