<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#fafbfd"/>
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Ingredients of a Stellar SED Fit</text>

  <!-- Ingredient boxes -->
  <g font-size="13" fill="#1f2937">
    <rect x="40" y="80" width="260" height="66" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="170" y="107" text-anchor="middle" font-weight="bold" fill="#1e3a8a">Stellar evolution +</text>
    <text x="170" y="127" text-anchor="middle" font-weight="bold" fill="#1e3a8a">atmosphere models</text>

    <rect x="40" y="170" width="260" height="66" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="170" y="197" text-anchor="middle" font-weight="bold" fill="#1e3a8a">Measured parallax</text>
    <text x="170" y="217" text-anchor="middle" font-size="12" fill="#374151">gives the distance</text>

    <rect x="40" y="260" width="260" height="66" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="170" y="287" text-anchor="middle" font-weight="bold" fill="#1e3a8a">Dust map + extinction curve</text>
    <text x="170" y="307" text-anchor="middle" font-size="12" fill="#374151">how much light dust removes</text>

    <rect x="40" y="350" width="260" height="66" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="170" y="377" text-anchor="middle" font-weight="bold" fill="#1e3a8a">Filter transmission curves</text>
    <text x="170" y="397" text-anchor="middle" font-size="12" fill="#374151">what each band actually sees</text>
  </g>

  <!-- Center pipeline -->
  <g font-size="13" fill="#1f2937">
    <rect x="380" y="90" width="250" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="505" y="119" text-anchor="middle" font-weight="bold" fill="#4c1d95">Intrinsic SED</text>
    <text x="505" y="141" text-anchor="middle" font-size="12" fill="#374151">the star's true spectrum</text>

    <rect x="380" y="200" width="250" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="505" y="229" text-anchor="middle" font-weight="bold" fill="#4c1d95">+ Distance</text>
    <text x="505" y="251" text-anchor="middle" font-size="12" fill="#374151">everything gets fainter</text>

    <rect x="380" y="310" width="250" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="505" y="339" text-anchor="middle" font-weight="bold" fill="#4c1d95">+ Reddening</text>
    <text x="505" y="361" text-anchor="middle" font-size="12" fill="#374151">blue light dims more than red</text>
  </g>

  <!-- Compare box -->
  <rect x="700" y="200" width="230" height="180" rx="12" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="815" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">Compare with observed</text>
  <text x="815" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">photometry</text>
  <text x="815" y="286" text-anchor="middle" font-size="12.5" fill="#374151">best match gives the star's</text>
  <text x="815" y="306" text-anchor="middle" font-size="12.5" fill="#374151">mass, radius, temperature,</text>
  <text x="815" y="326" text-anchor="middle" font-size="12.5" fill="#374151">and distance</text>

  <!-- Arrows -->
  <g stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#arrow4)">
    <line x1="304" y1="113" x2="376" y2="120"/>
    <line x1="304" y1="203" x2="376" y2="228"/>
    <line x1="304" y1="293" x2="376" y2="340"/>
    <line x1="304" y1="383" x2="376" y2="352"/>
    <line x1="505" y1="164" x2="505" y2="196"/>
    <line x1="505" y1="274" x2="505" y2="306"/>
    <line x1="634" y1="345" x2="696" y2="300"/>
  </g>

  <rect x="40" y="460" width="880" height="42" rx="8" fill="#fef9c3"/>
  <text x="480" y="486" text-anchor="middle" font-size="13.5" fill="#713f12">Public tools that implement this: BRUTUS (Speagle, Zucker et al. 2025), isochrones (Morton 2015), isoclassify (Huber et al. 2017)</text>
</svg>
