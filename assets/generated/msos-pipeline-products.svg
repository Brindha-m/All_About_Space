<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="#fafbfd"/>
  <text x="480" y="40" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2937">Roman MSOS Pipeline Products, Grouped by Release Cadence</text>

  <!-- Daily lane -->
  <rect x="40" y="80" width="140" height="70" rx="10" fill="#1e3a8a"/>
  <text x="110" y="121" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Daily</text>
  <rect x="210" y="80" width="710" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="230" y="108" font-size="14" font-weight="bold" fill="#1e3a8a">Light-curve catalog</text>
  <text x="230" y="132" font-size="12.5" fill="#374151">fluxes and positions for every star from PSF and difference-imaging photometry</text>

  <!-- Season lane -->
  <rect x="40" y="180" width="140" height="160" rx="10" fill="#5b21b6"/>
  <text x="110" y="255" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Per season</text>
  <rect x="210" y="180" width="345" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="230" y="208" font-size="14" font-weight="bold" fill="#4c1d95">Reference images + object catalogs</text>
  <text x="230" y="232" font-size="12.5" fill="#374151">super-sampled images; positions, proper motions</text>
  <rect x="575" y="180" width="345" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="595" y="208" font-size="14" font-weight="bold" fill="#4c1d95">Variability catalog</text>
  <text x="595" y="232" font-size="12.5" fill="#374151">variable-star classifications with confidences</text>
  <rect x="210" y="270" width="710" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="230" y="298" font-size="14" font-weight="bold" fill="#4c1d95">Microlensing event catalog</text>
  <text x="230" y="322" font-size="12.5" fill="#374151">fitted event parameters plus derived lens, source, and exoplanet properties</text>

  <!-- Survey lane -->
  <rect x="40" y="370" width="140" height="70" rx="10" fill="#065f46"/>
  <text x="110" y="411" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Per survey</text>
  <rect x="210" y="370" width="710" height="70" rx="10" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="230" y="398" font-size="14" font-weight="bold" fill="#065f46">Detection-efficiency catalog</text>
  <text x="230" y="422" font-size="12.5" fill="#374151">injection-recovery results describing what the survey could and could not detect - essential for occurrence rates</text>
</svg>
