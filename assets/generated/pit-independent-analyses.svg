<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="480" fill="#fafbfd"/>
  <text x="470" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Official Pipeline vs. Independent PIT Analyses</text>

  <g font-size="13" fill="#374151">
    <!-- Official column -->
    <rect x="40" y="70" width="410" height="300" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="245" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Official MSOS pipeline</text>
    <text x="60" y="140">- standardized, validated data products</text>
    <text x="60" y="168">- light curves, event catalogs,</text>
    <text x="70" y="186">detection efficiencies</text>
    <text x="60" y="214">- released after a ~30-day</text>
    <text x="70" y="232">validation period</text>
    <text x="60" y="260">- the reference that all published</text>
    <text x="70" y="278">results will build on</text>

    <!-- PIT column -->
    <rect x="490" y="70" width="410" height="300" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="695" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#4c1d95">Independent PIT checks</text>
    <text x="510" y="140">- quick, limited catalog and light curves</text>
    <text x="510" y="168">- "lite" difference images that can be</text>
    <text x="520" y="186">searched for transient events</text>
    <text x="510" y="214">- small pixel cutouts ("bundles") around</text>
    <text x="520" y="232">flagged events, used to:</text>
    <text x="530" y="258">- find solar-system objects and neighbors</text>
    <text x="530" y="282">- optimize PSF fitting and image stacks</text>
    <text x="510" y="312">- available fast: one full dither block</text>
    <text x="520" y="330">(~234 images) arrives every ~2 days</text>
  </g>

  <rect x="40" y="400" width="860" height="42" rx="8" fill="#d1fae5"/>
  <text x="470" y="426" text-anchor="middle" font-size="13.5" fill="#065f46" font-weight="bold">Goal: complement, not replace, the official pipeline - an independent check catches problems early.</text>
</svg>
