<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <clipPath id="clipH"><rect x="40" y="95" width="340" height="190" rx="12"/></clipPath>
    <clipPath id="clipE"><rect x="430" y="95" width="340" height="190" rx="12"/></clipPath>
    <clipPath id="clipR"><rect x="820" y="95" width="340" height="190" rx="12"/></clipPath>
    <radialGradient id="mirH" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fee2e2"/><stop offset="55%" stop-color="#fca5a5"/><stop offset="100%" stop-color="#b91c1c"/>
    </radialGradient>
    <radialGradient id="mirE" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#dcfce7"/><stop offset="55%" stop-color="#86efac"/><stop offset="100%" stop-color="#047857"/>
    </radialGradient>
    <radialGradient id="mirR" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ede9fe"/><stop offset="55%" stop-color="#c4b5fd"/><stop offset="100%" stop-color="#5b21b6"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="780" fill="#f8fafc"/>
  <text x="600" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Primary Mirror Diameter Comparison</text>
  <text x="600" y="68" text-anchor="middle" font-size="14" fill="#475569">Real telescopes above; mirrors below drawn to linear diameter scale (2.4 m vs 1.2 m)</text>

  <!-- Photos -->
  <rect x="40" y="95" width="340" height="190" rx="12" fill="#0f172a"/>
  <image href="hubble.png" x="40" y="95" width="340" height="190" preserveAspectRatio="xMidYMid slice" clip-path="url(#clipH)"/>
  <rect x="40" y="95" width="340" height="190" rx="12" fill="none" stroke="#b91c1c" stroke-width="3"/>
  <rect x="50" y="105" width="110" height="28" rx="8" fill="#7f1d1d"/>
  <text x="105" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#fecaca">Hubble</text>

  <rect x="430" y="95" width="340" height="190" rx="12" fill="#0f172a"/>
  <image href="euclid.png" x="430" y="95" width="340" height="190" preserveAspectRatio="xMidYMid slice" clip-path="url(#clipE)"/>
  <rect x="430" y="95" width="340" height="190" rx="12" fill="none" stroke="#047857" stroke-width="3"/>
  <rect x="440" y="105" width="100" height="28" rx="8" fill="#14532d"/>
  <text x="490" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#bbf7d0">Euclid</text>

  <rect x="820" y="95" width="340" height="190" rx="12" fill="#0f172a"/>
  <image href="roman.png" x="820" y="95" width="340" height="190" preserveAspectRatio="xMidYMid slice" clip-path="url(#clipR)"/>
  <rect x="820" y="95" width="340" height="190" rx="12" fill="none" stroke="#5b21b6" stroke-width="3"/>
  <rect x="830" y="105" width="100" height="28" rx="8" fill="#4c1d95"/>
  <text x="880" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#ede9fe">Roman</text>

  <!-- Mirror comparison panel -->
  <rect x="40" y="310" width="1120" height="400" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="345" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Primary mirrors to scale</text>
  <text x="600" y="370" text-anchor="middle" font-size="13" fill="#64748b">Collecting area grows as diameter squared - Euclid collects about 1/4 the light of Hubble or Roman</text>

  <!-- Scale bar -->
  <line x1="200" y1="400" x2="1000" y2="400" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="420" text-anchor="middle" font-size="12" fill="#64748b">scale reference: 2.4 m mirror = large disk; 1.2 m = half diameter</text>

  <!-- Hubble mirror -->
  <circle cx="250" cy="560" r="110" fill="url(#mirH)" stroke="#7f1d1d" stroke-width="4"/>
  <circle cx="250" cy="560" r="22" fill="#450a0a"/>
  <circle cx="250" cy="560" r="110" fill="none" stroke="#fecaca" stroke-width="1" stroke-dasharray="4 6" opacity="0.7"/>
  <text x="250" y="700" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">Hubble 2.4 m</text>
  <text x="250" y="722" text-anchor="middle" font-size="13" fill="#9f1239">area ~4.5 m2</text>

  <!-- Euclid mirror -->
  <circle cx="600" cy="560" r="55" fill="url(#mirE)" stroke="#14532d" stroke-width="4"/>
  <circle cx="600" cy="560" r="12" fill="#052e16"/>
  <text x="600" y="700" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Euclid 1.2 m</text>
  <text x="600" y="722" text-anchor="middle" font-size="13" fill="#15803d">area ~1.1 m2 (~1/4)</text>

  <!-- Roman mirror -->
  <circle cx="950" cy="560" r="110" fill="url(#mirR)" stroke="#4c1d95" stroke-width="4"/>
  <circle cx="950" cy="560" r="22" fill="#2e1065"/>
  <circle cx="950" cy="560" r="110" fill="none" stroke="#ddd6fe" stroke-width="1" stroke-dasharray="4 6" opacity="0.7"/>
  <text x="950" y="700" text-anchor="middle" font-size="18" font-weight="700" fill="#4c1d95">Roman 2.4 m</text>
  <text x="950" y="722" text-anchor="middle" font-size="13" fill="#6d28d9">area ~4.5 m2</text>

  <!-- Callout -->
  <rect x="360" y="450" width="480" height="55" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="600" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">Same aperture class: Hubble = Roman</text>
  <text x="600" y="492" text-anchor="middle" font-size="12" fill="#4338ca">Roman wins surveys with wide FOV + near-IR, not a bigger mirror</text>
</svg>
