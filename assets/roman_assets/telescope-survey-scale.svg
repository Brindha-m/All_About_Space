<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1040" height="580" fill="#fafbfd"/>
  <text x="520" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2937">Survey Scale on the Galactic Plane</text>
  <text x="520" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Roman Galactic Plane Survey components vs a typical Hubble archival footprint (workshop "Survey in a Nutshell")</text>

  <!-- Bar chart area -->
  <g transform="translate(80,90)">
    <!-- Y axis label -->
    <text x="-50" y="180" transform="rotate(-90 -50 180)" text-anchor="middle" font-size="13" fill="#374151">survey area (deg2)</text>

    <!-- Grid lines -->
    <g stroke="#e5e7eb" stroke-width="1">
      <line x1="0" y1="320" x2="900" y2="320"/>
      <line x1="0" y1="240" x2="900" y2="240"/>
      <line x1="0" y1="160" x2="900" y2="160"/>
      <line x1="0" y1="80" x2="900" y2="80"/>
      <line x1="0" y1="0" x2="900" y2="0"/>
    </g>
    <g font-size="11" fill="#6b7280" text-anchor="end">
      <text x="-8" y="324">0</text>
      <text x="-8" y="244">100</text>
      <text x="-8" y="164">300</text>
      <text x="-8" y="84">500</text>
      <text x="-8" y="4">700</text>
    </g>

    <!-- Scale: 700 deg2 = 320 px 0.457 px/deg2 -->
    <!-- HST ~6 2.7 px -->
    <rect x="60" y="317" width="70" height="3" fill="#ef4444"/>
    <text x="95" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">HST ~6</text>
    <text x="95" y="368" text-anchor="middle" font-size="11" fill="#9f1239">deg2 prior</text>
    <text x="95" y="386" text-anchor="middle" font-size="10" fill="#9f1239">workshop note</text>

    <!-- Euclid conceptual wide (not plane survey) - show as reference "~15,000 deg2 cosmology" would break scale; instead note separately -->

    <!-- Roman deep 4.8 2.2 -->
    <rect x="220" y="318" width="90" height="2" fill="#a78bfa"/>
    <text x="265" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Deep 4.8</text>
    <text x="265" y="368" text-anchor="middle" font-size="11" fill="#6d28d9">deg2 30 h</text>
    <text x="265" y="386" text-anchor="middle" font-size="10" fill="#7c3aed">all filters +0.75 mag</text>

    <!-- Roman TD 19.1 8.7 -->
    <rect x="380" y="311" width="90" height="9" fill="#8b5cf6"/>
    <text x="425" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Time-dom. 19</text>
    <text x="425" y="368" text-anchor="middle" font-size="11" fill="#6d28d9">deg2 130 h</text>
    <text x="425" y="386" text-anchor="middle" font-size="10" fill="#7c3aed">7 filters NSD/CMZ</text>

    <!-- Roman wide 691 316 -->
    <rect x="540" y="4" width="110" height="316" fill="#7c3aed"/>
    <text x="595" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">Wide 691</text>
    <text x="595" y="368" text-anchor="middle" font-size="11" fill="#5b21b6">deg2 541 h</text>
    <text x="595" y="386" text-anchor="middle" font-size="10" fill="#6d28d9">F129/F213 F158/F184</text>

    <!-- Euclid callout box (off-scale) -->
    <rect x="720" y="40" width="170" height="200" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="805" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Euclid (context)</text>
    <text x="805" y="100" text-anchor="middle" font-size="12" fill="#166534">Wide Survey</text>
    <text x="805" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#047857">~15,000</text>
    <text x="805" y="142" text-anchor="middle" font-size="12" fill="#166534">deg2 extragalactic</text>
    <text x="805" y="170" text-anchor="middle" font-size="11" fill="#15803d">Different sky goal:</text>
    <text x="805" y="190" text-anchor="middle" font-size="11" fill="#15803d">cosmology, not</text>
    <text x="805" y="208" text-anchor="middle" font-size="11" fill="#15803d">bulge time-domain</text>
    <text x="805" y="226" text-anchor="middle" font-size="11" fill="#15803d">cadence science</text>
  </g>

  <!-- Source yield callout -->
  <rect x="80" y="490" width="880" height="62" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="520" y="516" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Roman Galactic Plane Survey: ~20 billion sources estimated</text>
  <text x="520" y="538" text-anchor="middle" font-size="12" fill="#6d28d9">Wide (691) + Time-domain (19) + Deep/spectral (~5) Hubble prior coverage on this map H 6 deg2</text>
</svg>
