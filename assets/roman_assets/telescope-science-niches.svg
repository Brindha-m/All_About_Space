<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <clipPath id="pH"><rect x="40" y="100" width="350" height="175" rx="12"/></clipPath>
    <clipPath id="pE"><rect x="425" y="100" width="350" height="175" rx="12"/></clipPath>
    <clipPath id="pR"><rect x="810" y="100" width="350" height="175" rx="12"/></clipPath>
  </defs>

  <rect width="1200" height="900" fill="#0b1220"/>
  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#f8fafc">Science Niches: What Each Telescope Does Best</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#94a3b8">Complementary tools - Hubble for sharp UV/optical, Euclid for wide maps, Roman for IR time-domain exoplanets</text>

  <!-- HUBBLE -->
  <rect x="40" y="100" width="350" height="740" rx="16" fill="#1c1414" stroke="#f87171" stroke-width="2.5"/>
  <image href="hubble.png" x="40" y="100" width="350" height="175" preserveAspectRatio="xMidYMid slice" clip-path="url(#pH)"/>
  <rect x="40" y="100" width="350" height="175" rx="12" fill="none" stroke="#f87171" stroke-width="2.5"/>
  <rect x="55" y="115" width="120" height="32" rx="8" fill="#7f1d1d"/>
  <text x="115" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#fecaca">Hubble</text>
  <text x="215" y="255" font-size="12" font-weight="700" fill="#fecaca">2.4 m  |  sharp pointed imaging</text>

  <text x="60" y="310" font-size="15" font-weight="700" fill="#fda4af">Best at</text>
  <text x="60" y="338" font-size="13" fill="#fecaca">UV access (unique here)</text>
  <text x="60" y="360" font-size="13" fill="#fecaca">Highest angular resolution</text>
  <text x="60" y="382" font-size="13" fill="#fecaca">Deep GO pointed programs</text>
  <text x="60" y="404" font-size="13" fill="#fecaca">Decades of archival baselines</text>

  <text x="60" y="445" font-size="15" font-weight="700" fill="#fca5a5">Not built for</text>
  <text x="60" y="473" font-size="13" fill="#fecaca">GBTDS-scale sky mapping</text>
  <text x="60" y="495" font-size="13" fill="#fecaca">Tiny FOV (~1/100 of Roman)</text>
  <text x="60" y="517" font-size="13" fill="#fecaca">LEO Earth occultations</text>

  <rect x="60" y="550" width="310" height="120" rx="10" fill="#3f1d1d"/>
  <text x="75" y="580" font-size="14" font-weight="700" fill="#fecaca">Role with Roman</text>
  <text x="75" y="608" font-size="13" fill="#fecaca">High-res follow-up of blends</text>
  <text x="75" y="630" font-size="13" fill="#fecaca">Lens-source separation later</text>
  <text x="75" y="652" font-size="13" fill="#fecaca">Precursor colors and motions</text>

  <text x="215" y="800" text-anchor="middle" font-size="13" font-weight="700" fill="#f87171">Hidden gems in crowded fields</text>

  <!-- EUCLID -->
  <rect x="425" y="100" width="350" height="740" rx="16" fill="#0f1f17" stroke="#4ade80" stroke-width="2.5"/>
  <image href="euclid.png" x="425" y="100" width="350" height="175" preserveAspectRatio="xMidYMid slice" clip-path="url(#pE)"/>
  <rect x="425" y="100" width="350" height="175" rx="12" fill="none" stroke="#4ade80" stroke-width="2.5"/>
  <rect x="440" y="115" width="110" height="32" rx="8" fill="#14532d"/>
  <text x="495" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#bbf7d0">Euclid</text>
  <text x="600" y="255" font-size="12" font-weight="700" fill="#bbf7d0">1.2 m  |  widest cosmology maps</text>

  <text x="445" y="310" font-size="15" font-weight="700" fill="#86efac">Best at</text>
  <text x="445" y="338" font-size="13" fill="#bbf7d0">Very wide FOV (~0.5 deg2)</text>
  <text x="445" y="360" font-size="13" fill="#bbf7d0">Optical VIS + NIR NISP</text>
  <text x="445" y="382" font-size="13" fill="#bbf7d0">All-sky / wide surveys</text>
  <text x="445" y="404" font-size="13" fill="#bbf7d0">Already on sky (2023+)</text>

  <text x="445" y="445" font-size="15" font-weight="700" fill="#86efac">Not built for</text>
  <text x="445" y="473" font-size="13" fill="#bbf7d0">GBTDS planet cadence</text>
  <text x="445" y="495" font-size="13" fill="#bbf7d0">Hubble-class collecting area</text>
  <text x="445" y="517" font-size="13" fill="#bbf7d0">Fine IR sampling (NISP 0.33)</text>

  <rect x="445" y="550" width="310" height="120" rx="10" fill="#14532d"/>
  <text x="460" y="580" font-size="14" font-weight="700" fill="#bbf7d0">Role with Roman</text>
  <text x="460" y="608" font-size="13" fill="#bbf7d0">Precursor wide photometry</text>
  <text x="460" y="630" font-size="13" fill="#bbf7d0">Extra colors for SED fits</text>
  <text x="460" y="652" font-size="13" fill="#bbf7d0">Space-space parallax leverage</text>

  <text x="600" y="800" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80">Wide maps find candidates</text>

  <!-- ROMAN -->
  <rect x="810" y="100" width="350" height="740" rx="16" fill="#16102a" stroke="#c4b5fd" stroke-width="2.5"/>
  <image href="roman.png" x="810" y="100" width="350" height="175" preserveAspectRatio="xMidYMid slice" clip-path="url(#pR)"/>
  <rect x="810" y="100" width="350" height="175" rx="12" fill="none" stroke="#c4b5fd" stroke-width="2.5"/>
  <rect x="825" y="115" width="110" height="32" rx="8" fill="#4c1d95"/>
  <text x="880" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#ede9fe">Roman</text>
  <text x="985" y="255" font-size="12" font-weight="700" fill="#ede9fe">2.4 m  |  IR survey + time domain</text>

  <text x="830" y="310" font-size="15" font-weight="700" fill="#c4b5fd">Best at</text>
  <text x="830" y="338" font-size="13" fill="#ede9fe">Hubble-class + ~100x FOV</text>
  <text x="830" y="360" font-size="13" fill="#ede9fe">Near-IR through bulge dust</text>
  <text x="830" y="382" font-size="13" fill="#ede9fe">GBTDS: millions of light curves</text>
  <text x="830" y="404" font-size="13" fill="#ede9fe">Microlensing + transit census</text>

  <text x="830" y="445" font-size="15" font-weight="700" fill="#c4b5fd">Still hard</text>
  <text x="830" y="473" font-size="13" fill="#ede9fe">Crowding and blends</text>
  <text x="830" y="495" font-size="13" fill="#ede9fe">Cadence / filter trade-offs</text>
  <text x="830" y="517" font-size="13" fill="#ede9fe">~1.4 TB/day pipelines</text>

  <rect x="830" y="550" width="310" height="120" rx="10" fill="#3b0764"/>
  <text x="845" y="580" font-size="14" font-weight="700" fill="#ede9fe">Unique products</text>
  <text x="845" y="608" font-size="13" fill="#ede9fe">Cold / free-floating planets</text>
  <text x="845" y="630" font-size="13" fill="#ede9fe">Bulge transit demographics</text>
  <text x="845" y="652" font-size="13" fill="#ede9fe">CGI path to Earth twins</text>

  <text x="985" y="800" text-anchor="middle" font-size="13" font-weight="700" fill="#c4b5fd">Exoplanet survey engine</text>

  <text x="600" y="870" text-anchor="middle" font-size="13" fill="#94a3b8">Together: Euclid finds wide; Hubble resolves; Roman times and counts planets</text>
</svg>
