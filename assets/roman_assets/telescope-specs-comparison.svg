<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1100" height="720" fill="#f8fafc"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Hubble Euclid Roman - Instrument Specs Side by Side</text>
  <text x="550" y="58" text-anchor="middle" font-size="13" fill="#64748b">Minute details from workshop slides and published mission parameters (survey design can still evolve)</text>

  <!-- Column headers -->
  <g text-anchor="middle" font-weight="700" font-size="16">
    <rect x="280" y="78" width="240" height="36" rx="6" fill="#fecaca"/>
    <text x="400" y="101" fill="#7f1d1d">Hubble (HST)</text>
    <rect x="530" y="78" width="240" height="36" rx="6" fill="#bbf7d0"/>
    <text x="650" y="101" fill="#14532d">Euclid</text>
    <rect x="780" y="78" width="240" height="36" rx="6" fill="#ddd6fe"/>
    <text x="900" y="101" fill="#4c1d95">Roman (RST)</text>
  </g>

  <!-- Row labels + values -->
  <g font-size="13">
    <!-- Primary mirror -->
    <rect x="40" y="128" width="230" height="44" rx="4" fill="#e2e8f0"/>
    <text x="55" y="155" font-weight="700" fill="#1e293b">Primary mirror</text>
    <rect x="280" y="128" width="240" height="44" fill="#fff1f2" stroke="#fecaca"/>
    <text x="400" y="148" text-anchor="middle" fill="#7f1d1d" font-weight="700">2.4 m</text>
    <text x="400" y="164" text-anchor="middle" fill="#9f1239" font-size="11">same glass heritage class</text>
    <rect x="530" y="128" width="240" height="44" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="650" y="148" text-anchor="middle" fill="#14532d" font-weight="700">1.2 m</text>
    <text x="650" y="164" text-anchor="middle" fill="#166534" font-size="11">half Hubble/Roman diameter</text>
    <rect x="780" y="128" width="240" height="44" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="900" y="148" text-anchor="middle" fill="#4c1d95" font-weight="700">2.4 m</text>
    <text x="900" y="164" text-anchor="middle" fill="#6d28d9" font-size="11">Hubble-class collecting area</text>

    <!-- FOV -->
    <rect x="40" y="178" width="230" height="52" rx="4" fill="#e2e8f0"/>
    <text x="55" y="209" font-weight="700" fill="#1e293b">Field of view (active)</text>
    <rect x="280" y="178" width="240" height="52" fill="#fff1f2" stroke="#fecaca"/>
    <text x="400" y="200" text-anchor="middle" fill="#7f1d1d" font-weight="700">~0.003 deg2</text>
    <text x="400" y="218" text-anchor="middle" fill="#9f1239" font-size="11">~1/100 of Roman (workshop)</text>
    <rect x="530" y="178" width="240" height="52" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="650" y="200" text-anchor="middle" fill="#14532d" font-weight="700">~0.5-0.57 deg2</text>
    <text x="650" y="218" text-anchor="middle" fill="#166534" font-size="11">VIS ~0.57 NISP ~0.53</text>
    <rect x="780" y="178" width="240" height="52" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="900" y="200" text-anchor="middle" fill="#4c1d95" font-weight="700">0.281 deg2</text>
    <text x="900" y="218" text-anchor="middle" fill="#6d28d9" font-size="11">0.8 0.4 WFI footprint</text>

    <!-- Pixel scale -->
    <rect x="40" y="236" width="230" height="44" rx="4" fill="#e2e8f0"/>
    <text x="55" y="263" font-weight="700" fill="#1e293b">Spatial sampling</text>
    <rect x="280" y="236" width="240" height="44" fill="#fff1f2" stroke="#fecaca"/>
    <text x="400" y="256" text-anchor="middle" fill="#7f1d1d" font-weight="700">~0.04-0.053/pix</text>
    <text x="400" y="272" text-anchor="middle" fill="#9f1239" font-size="11">ACS / WFC3 typical</text>
    <rect x="530" y="236" width="240" height="44" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="650" y="256" text-anchor="middle" fill="#14532d" font-weight="700">0.13 (VIS) 0.33 (NISP)</text>
    <text x="650" y="272" text-anchor="middle" fill="#166534" font-size="11">optical finer than NIR</text>
    <rect x="780" y="236" width="240" height="44" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="900" y="256" text-anchor="middle" fill="#4c1d95" font-weight="700">0.113/pix</text>
    <text x="900" y="272" text-anchor="middle" fill="#6d28d9" font-size="11">288 Mpix focal plane</text>

    <!-- Detectors -->
    <rect x="40" y="286" width="230" height="52" rx="4" fill="#e2e8f0"/>
    <text x="55" y="317" font-weight="700" fill="#1e293b">Detector mosaic</text>
    <rect x="280" y="286" width="240" height="52" fill="#fff1f2" stroke="#fecaca"/>
    <text x="400" y="308" text-anchor="middle" fill="#7f1d1d" font-weight="700">1 sensor (typical WFC)</text>
    <text x="400" y="326" text-anchor="middle" fill="#9f1239" font-size="11">workshop: Hubble = one imager</text>
    <rect x="530" y="286" width="240" height="52" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="650" y="308" text-anchor="middle" fill="#14532d" font-weight="700">VIS CCDs + NISP HgCdTe</text>
    <text x="650" y="326" text-anchor="middle" fill="#166534" font-size="11">dual-channel focal planes</text>
    <rect x="780" y="286" width="240" height="52" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="900" y="308" text-anchor="middle" fill="#4c1d95" font-weight="700">63 H4RG-10</text>
    <text x="900" y="326" text-anchor="middle" fill="#6d28d9" font-size="11">Teledyne IR array mosaic</text>

    <!-- Bandpass -->
    <rect x="40" y="344" width="230" height="44" rx="4" fill="#e2e8f0"/>
    <text x="55" y="371" font-weight="700" fill="#1e293b">Science bandpass</text>
    <rect x="280" y="344" width="240" height="44" fill="#fff1f2" stroke="#fecaca"/>
    <text x="400" y="364" text-anchor="middle" fill="#7f1d1d" font-weight="700">UV NIR (~0.1-1.7 um)</text>
    <text x="400" y="380" text-anchor="middle" fill="#9f1239" font-size="11">instrument-dependent</text>
    <rect x="530" y="344" width="240" height="44" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="650" y="364" text-anchor="middle" fill="#14532d" font-weight="700">VIS + NISP (~0.55-2.0 um)</text>
    <text x="650" y="380" text-anchor="middle" fill="#166534" font-size="11">no UV channel</text>
    <rect x="780" y="344" width="240" height="44" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="900" y="364" text-anchor="middle" fill="#4c1d95" font-weight="700">0.48-2.3 um (WFI)</text>
    <text x="900" y="380" text-anchor="middle" fill="#6d28d9" font-size="11">8 filters + grism + prism</text>

    <!-- Focal ratio -->
    <rect x="40" y="394" width="230" height="44" rx="4" fill="#e2e8f0"/>
    <text x="55" y="421" font-weight="700" fill="#1e293b">Focal ratio</text>
    <rect x="280" y="394" width="240" height="44" fill="#fff1f2" stroke="#fecaca"/>
    <text x="400" y="421" text-anchor="middle" fill="#7f1d1d" font-weight="700">f/24</text>
    <rect x="530" y="394" width="240" height="44" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="650" y="421" text-anchor="middle" fill="#14532d" font-weight="700">~f/20 (telescope)</text>
    <rect x="780" y="394" width="240" height="44" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="900" y="421" text-anchor="middle" fill="#4c1d95" font-weight="700">f/7.9 (WFI + telescope)</text>

    <!-- Orbit / launch -->
    <rect x="40" y="444" width="230" height="52" rx="4" fill="#e2e8f0"/>
    <text x="55" y="475" font-weight="700" fill="#1e293b">Orbit launch era</text>
    <rect x="280" y="444" width="240" height="52" fill="#fff1f2" stroke="#fecaca"/>
    <text x="400" y="466" text-anchor="middle" fill="#7f1d1d" font-weight="700">LEO 1990</text>
    <text x="400" y="484" text-anchor="middle" fill="#9f1239" font-size="11">serviceable, Earth-shadowed</text>
    <rect x="530" y="444" width="240" height="52" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="650" y="466" text-anchor="middle" fill="#14532d" font-weight="700">L2 2023</text>
    <text x="650" y="484" text-anchor="middle" fill="#166534" font-size="11">stable thermal / continuous sky</text>
    <rect x="780" y="444" width="240" height="52" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="900" y="466" text-anchor="middle" fill="#4c1d95" font-weight="700">L2 mid-2020s</text>
    <text x="900" y="484" text-anchor="middle" fill="#6d28d9" font-size="11">~1.4 TB/day downlink</text>

    <!-- Primary science -->
    <rect x="40" y="502" width="230" height="72" rx="4" fill="#e2e8f0"/>
    <text x="55" y="542" font-weight="700" fill="#1e293b">Primary science mode</text>
    <rect x="280" y="502" width="240" height="72" fill="#fff1f2" stroke="#fecaca"/>
    <text x="400" y="528" text-anchor="middle" fill="#7f1d1d" font-weight="700">Deep pointed imaging</text>
    <text x="400" y="546" text-anchor="middle" fill="#9f1239" font-size="11">UV-optical detail, GO programs</text>
    <text x="400" y="562" text-anchor="middle" fill="#9f1239" font-size="11">small FOV, exquisite resolution</text>
    <rect x="530" y="502" width="240" height="72" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="650" y="528" text-anchor="middle" fill="#14532d" font-weight="700">Wide cosmology survey</text>
    <text x="650" y="546" text-anchor="middle" fill="#166534" font-size="11">weak lensing, galaxy clustering</text>
    <text x="650" y="562" text-anchor="middle" fill="#166534" font-size="11">dark energy / dark matter</text>
    <rect x="780" y="502" width="240" height="72" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="900" y="528" text-anchor="middle" fill="#4c1d95" font-weight="700">Wide IR + time domain</text>
    <text x="900" y="546" text-anchor="middle" fill="#6d28d9" font-size="11">GBTDS microlensing &amp; transits</text>
    <text x="900" y="562" text-anchor="middle" fill="#6d28d9" font-size="11">+ dark energy + CGI tech demo</text>
  </g>

  <text x="550" y="612" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">One-line takeaway</text>
  <text x="550" y="638" text-anchor="middle" font-size="13" fill="#334155">Hubble: sharpest pointed UV-optical. Euclid: widest cosmology map. Roman: Hubble-class resolution over ~100 FOV in the near-IR, built for surveys and time domain.</text>
  <text x="550" y="668" text-anchor="middle" font-size="12" fill="#64748b">Sources: workshop WFI parameters slide; ESA Euclid instrument fact sheets; NASA Roman mission overview.</text>
  <text x="550" y="692" text-anchor="middle" font-size="12" fill="#94a3b8">Numbers are approximate and instrument-mode dependent - always check current mission documentation before citing in research.</text>
</svg>
