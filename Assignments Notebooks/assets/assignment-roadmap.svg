<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
  <rect width="1200" height="980" fill="#fffefb"/>
  <text x="50" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2937">Hands-on notebook roadmap</text>
  <rect x="50" y="58" width="420" height="8" rx="4" fill="#77c943"/>

  <!-- Top flow: 4 equal cards with more height so text is not clipped -->
  <rect x="40" y="90" width="250" height="130" rx="14" fill="#ecfdf5" stroke="#1f2937" stroke-width="3"/>
  <text x="165" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#065f46">0. Setup</text>
  <text x="165" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">install MulensModel</text>
  <text x="165" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">download data</text>
  <text x="165" y="201" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Microlens_Setup.ipynb</text>

  <path d="M295 155 H320" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <path d="M305 143 l18 12 -18 12" fill="none" stroke="#1f2937" stroke-width="4"/>

  <rect x="325" y="90" width="250" height="130" rx="14" fill="#eff6ff" stroke="#1f2937" stroke-width="3"/>
  <text x="450" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">1. Single Lens</text>
  <text x="450" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">PSPL -&gt; FSPL -&gt; MCMC</text>
  <text x="450" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">blending degeneracy</text>
  <text x="450" y="201" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">SingleLens.ipynb</text>

  <path d="M580 155 H605" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <path d="M590 143 l18 12 -18 12" fill="none" stroke="#1f2937" stroke-width="4"/>

  <rect x="610" y="90" width="250" height="130" rx="14" fill="#fef3c7" stroke="#1f2937" stroke-width="3"/>
  <text x="735" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#92400e">2. Binary Lens</text>
  <text x="735" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">s, q, alpha, rho</text>
  <text x="735" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">caustics + grid + MCMC</text>
  <text x="735" y="201" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Binary_Lens.ipynb</text>

  <path d="M865 155 H890" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <path d="M875 143 l18 12 -18 12" fill="none" stroke="#1f2937" stroke-width="4"/>

  <rect x="895" y="90" width="265" height="130" rx="14" fill="#fce7f3" stroke="#1f2937" stroke-width="3"/>
  <text x="1027" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#9d174d">3. Hands-On II</text>
  <text x="1027" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Transit + Galactic</text>
  <text x="1027" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">place host in the Galaxy</text>
  <text x="1027" y="201" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">Transit / Galactic notebooks</text>

  <!-- Bottom detail boxes -->
  <rect x="40" y="250" width="360" height="320" rx="16" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
  <text x="220" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">Hands-On I</text>
  <text x="70" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2937">- Learn MulensModel objects</text>
  <text x="70" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2937">- Fit point-lens events (PSPL)</text>
  <text x="70" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2937">- Add finite-source / parallax</text>
  <text x="70" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2937">- Fit planets via binary lens</text>
  <text x="70" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">Question:</text>
  <text x="70" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2937">What is the light-curve model?</text>
  <text x="70" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#6b7280">Output: parameters + residuals</text>

  <rect x="420" y="250" width="360" height="320" rx="16" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
  <text x="600" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#9d174d">Hands-On II</text>
  <text x="450" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2937">- Read event + star tables</text>
  <text x="450" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2937">- Place stars on a CMD</text>
  <text x="450" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2937">- Compare to Galaxy sims</text>
  <text x="450" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2937">- Use isochrones / kinematics</text>
  <text x="450" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#9d174d">Question:</text>
  <text x="450" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2937">Where is this system in the MW?</text>
  <text x="450" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#6b7280">Output: host + planet physics</text>

  <rect x="800" y="250" width="360" height="320" rx="16" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
  <text x="980" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#065f46">Rule of thumb</text>
  <text x="830" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2937">1. Look at the light curve</text>
  <text x="830" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2937">2. Pick the simplest model</text>
  <text x="830" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2937">3. Fit, then check residuals</text>
  <text x="830" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2937">4. Add complexity only if</text>
  <text x="850" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2937">residuals demand it</text>
  <text x="830" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2937">5. Then put the star in</text>
  <text x="850" y="515" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">Galactic context</text>

  <!-- Legend / abbreviations panel -->
  <rect x="40" y="595" width="1120" height="350" rx="16" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
  <text x="600" y="635" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">Legend and abbreviations</text>
  <line x1="70" y1="655" x2="1130" y2="655" stroke="#d1d5db" stroke-width="2"/>

  <!-- Color key -->
  <text x="70" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Color key</text>
  <rect x="70" y="705" width="18" height="18" rx="4" fill="#ecfdf5" stroke="#065f46" stroke-width="2"/>
  <text x="98" y="719" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937">Setup</text>
  <rect x="170" y="705" width="18" height="18" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="198" y="719" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937">Single Lens</text>
  <rect x="310" y="705" width="18" height="18" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="338" y="719" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937">Binary Lens</text>
  <rect x="450" y="705" width="18" height="18" rx="4" fill="#fce7f3" stroke="#9d174d" stroke-width="2"/>
  <text x="478" y="719" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937">Hands-On II (context)</text>

  <!-- Model abbreviations - left column -->
  <text x="70" y="760" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Model names</text>
  <text x="70" y="785" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937"><tspan font-weight="700" fill="#1d4ed8">PSPL</tspan>  Point Source, Point Lens (simplest)</text>
  <text x="70" y="808" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937"><tspan font-weight="700" fill="#9d174d">FSPL</tspan>  Finite Source, Point Lens (add rho)</text>
  <text x="70" y="831" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937"><tspan font-weight="700" fill="#92400e">FSBL / 2L1S</tspan>  Finite Source, Binary Lens</text>
  <text x="70" y="854" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937"><tspan font-weight="700">MCMC</tspan>  Monte Carlo sampling for errors</text>
  <text x="70" y="877" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937"><tspan font-weight="700">chi2</tspan>  chi-squared fit (first pass)</text>

  <!-- Parameters - middle column -->
  <text x="520" y="760" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Light-curve parameters</text>
  <text x="520" y="785" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937"><tspan font-weight="700" fill="#1d4ed8">t0</tspan>  time of closest approach / peak</text>
  <text x="520" y="808" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937"><tspan font-weight="700" fill="#1d4ed8">u0</tspan>  impact parameter (in Einstein radii)</text>
  <text x="520" y="831" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937"><tspan font-weight="700" fill="#1d4ed8">t_E</tspan>  Einstein crossing time (duration)</text>
  <text x="520" y="854" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937"><tspan font-weight="700" fill="#92400e">s, q</tspan>  separation, mass ratio (binary)</text>
  <text x="520" y="877" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937"><tspan font-weight="700" fill="#92400e">alpha, rho</tspan>  trajectory angle, source size</text>

  <!-- Context abbreviations - right column -->
  <text x="900" y="760" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Context terms</text>
  <text x="900" y="785" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937"><tspan font-weight="700" fill="#9d174d">CMD</tspan>  Color-Magnitude Diagram</text>
  <text x="900" y="808" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937"><tspan font-weight="700" fill="#065f46">MW</tspan>  Milky Way</text>
  <text x="900" y="831" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937"><tspan font-weight="700">PM</tspan>  proper motion</text>
  <text x="900" y="854" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937"><tspan font-weight="700">Rp/Rstar</tspan>  planet/star radius ratio</text>
  <text x="900" y="877" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937"><tspan font-weight="700">Mp</tspan>  planet mass (physical)</text>

  <text x="600" y="920" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4b5563">MulensModel = open-source package used in Hands-On I to build and score microlensing models</text>
</svg>
